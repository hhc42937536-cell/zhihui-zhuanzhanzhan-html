                    <span class="text-yellow-400 text-lg">${stars}</span>
                    <span class="font-bold text-lg">${sol.rating}</span>
                    <span class="text-gray-400 text-sm">(${sol.reviewCount} 人評分)</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-300">
                    <i class="ri-time-line"></i>
                    <span class="text-sm">實施時間：${sol.timeToImplement}</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-300">
                    <i class="ri-money-dollar-circle-line"></i>
                    <span class="text-sm">${sol.costEstimate}</span>
                  </div>
                  <span class="bg-${diff.color}-500/20 text-${diff.color}-300 px-3 py-1 rounded-full text-sm font-semibold">
                    ${diff.label}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="max-w-5xl mx-auto px-6 py-12 space-y-12">

          <!-- 實施步驟 -->
          <section>
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-3">
              <div class="w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center">
                <i class="ri-list-check-2 text-white text-lg"></i>
              </div>
              實施步驟
            </h2>
            <div class="space-y-4">
              ${sol.steps.map((step, i) => `
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex gap-5">
                  <div class="w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center text-white font-bold text-lg shrink-0">${i+1}</div>
                  <div>
                    <h3 class="font-bold text-gray-900 mb-1">${step.title}</h3>
                    <p class="text-gray-600 leading-relaxed">${step.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- 推薦工具 -->
          <section>
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-3">
              <div class="w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center">
                <i class="ri-tools-line text-white text-lg"></i>
              </div>
              推薦工具
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${sol.tools.map(tool => `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                  <div class="flex items-start justify-between mb-3">
                    <h3 class="font-bold text-gray-900">${tool.name}</h3>
                    <span class="${tool.free ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'} text-xs font-semibold px-2 py-0.5 rounded-full">
                      ${tool.free ? '免費' : '付費'}
                    </span>
                  </div>
                  <p class="text-gray-600 text-sm leading-relaxed">${tool.desc}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- 案例研究 -->
          <section>
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-3">
              <div class="w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center">
                <i class="ri-trophy-line text-white text-lg"></i>
              </div>
              成功案例
            </h2>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div class="${c.light} ${c.border} border-b px-6 py-4">
                <span class="font-bold ${c.text} flex items-center gap-2">
                  <i class="ri-building-line"></i> ${sol.caseStudy.business}
                </span>
              </div>
              <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                  <div class="text-xs font-bold text-red-500 uppercase tracking-wide mb-2 flex items-center gap-1">
                    <i class="ri-error-warning-line"></i> 面臨挑戰
                  </div>
                  <p class="text-gray-700 text-sm leading-relaxed">${sol.caseStudy.challenge}</p>
                </div>
                <div>
                  <div class="text-xs font-bold text-blue-500 uppercase tracking-wide mb-2 flex items-center gap-1">
                    <i class="ri-lightbulb-line"></i> 解決方案
                  </div>
                  <p class="text-gray-700 text-sm leading-relaxed">${sol.caseStudy.solution}</p>
                </div>
                <div>
                  <div class="text-xs font-bold text-green-500 uppercase tracking-wide mb-2 flex items-center gap-1">
                    <i class="ri-check-double-line"></i> 成果
                  </div>
                  <p class="text-gray-700 text-sm leading-relaxed">${sol.caseStudy.result}</p>
                </div>
              </div>
            </div>
          </section>

          <!-- 相關方案 -->
          <section>
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-3">
              <div class="w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center">
                <i class="ri-layout-grid-line text-white text-lg"></i>
              </div>
              相關方案
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${related.map(r => {
                const rc = colorMap[r.color] || colorMap.teal;
                return `
                  <a href="solution-detail.html?id=${r.id}" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md hover:-translate-y-1 transition-all group block">
                    <div class="w-10 h-10 ${rc.bg} rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <i class="${r.icon} text-white"></i>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-2 text-sm leading-snug">${r.title}</h3>
                    <p class="text-gray-500 text-xs leading-relaxed line-clamp-2">${r.description}</p>
                  </a>
                `;
              }).join('')}
            </div>
          </section>

        </div>
      `;
    }

    renderPage();
  </script>
</body>
</html>
